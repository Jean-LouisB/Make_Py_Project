[project]
name = "Py_Project_Packagor"
version = "1.0.3"
description = "Générateur de projet python"
authors = [
            { name = "Fabrice Kopf", email= "contact@fabricekopf.fr" },
        ]
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
py-init = "py_project_packagor.run:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_project_packagor*"]

[tool.setuptools.package-data]
func = ["py.typed"]

[project.urls]
Repository = "https://github.com/Jean-LouisB/Py-Project-Generator.git"
Changelog = "https://github.com/Jean-LouisB/Py-Project-Generator/blob/0fa0b2edafdbc8b0ed3545c8162e27adb3d908e1/CHANGELOG.md"