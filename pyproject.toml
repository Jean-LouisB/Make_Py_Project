[project]
name = "Make_Py_Project"
version = "1.0.0"
description = "Générateur de projet python"
authors = [
            { name = "Fabrice Kopf", email= "contact@fabricekopf.fr" },
        ]
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
py-init = "make_py_project.run:run"
mpp = "make_py_project.run:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["make_py_project*"]

[tool.setuptools.package-data]
func = ["py.typed"]

[project.urls]
Repository = "https://github.com/Jean-LouisB/Make_Py_Projectgit"
Changelog = "https://github.com/Jean-LouisB/Make_Py_Project/blob/main/CHANGELOG.md"