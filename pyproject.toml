[project]
name = "Py_Project_Generator"
version = "1.0.0"
description = "Générateur de projet python"
authors = [
            { name = "Fabrice Kopf", email= "contact@fabricekopf.fr" },
        ]
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
py-init = "py_project_generator.run:run"
ppg = "py_project_generator.run:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_project_generator*"]

[tool.setuptools.package-data]
func = ["py.typed"]

[project.urls]
Repository = "https://github.com/Jean-LouisB/Py-Project-Generator.git"
Changelog = "https://github.com/Jean-LouisB/Py-Project-Generator/blob/main/CHANGELOG.md"